syntax = "proto3";

package auth.v1;

option go_package = "GoLearning-IdentityMicroService/api/v1";

service PublicIdentityService {
    rpc Register(RegisterRequest) returns (RegisterResponse);
    rpc Login(LoginRequest) returns (LoginResponse);
    rpc GetUserByID(GetUserRequest) returns (GetUserResponse);
    rpc GetUserByEmail(GetUserRequest) returns (GetUserResponse);
    rpc GetUserByUsername(GetUserRequest) returns (GetUserResponse);
    rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
    rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
    rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);
    rpc Logout(LogoutRequest) returns (LogoutResponse);
}

service InternalIdentityService {
    rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
    rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
}
//TODO Add user messages

// --- Public messages ---
message GetUserRequest{
    int32 id = 3; 
    string email = 1;
    string username = 2;
}

message GetUserResponse{
    int32 id = 1;
    string email = 2;
    string username = 3;
    string birthdate = 4;
}

message RegisterRequest {
    string email = 1;
    string username = 2;
    string password = 3;
    string birthdate = 4;
}

message RegisterResponse {
    bool success = 1;
    int32 user_id = 2;
}

message LoginRequest {
    string usernameoremail = 1;
    string password = 2;
}

message LoginResponse {
    string access_token = 1;
    string refresh_token = 2;
    int32 user_id = 3;
    string message = 4;
}

message UpdateUserRequest {
    int32 user_id = 1;
    string email = 2;
    string username = 3;
    string birthdate = 4;
}

message UpdateUserResponse {
    bool success = 1;
}

message DeleteUserRequest {
    int32 user_id = 1;
}

message DeleteUserResponse {
    bool success = 1;
}

message ChangePasswordRequest {
    int32 user_id = 1;
    string current_password = 2;
    string new_password = 3;
}

message ChangePasswordResponse {
    bool success = 1;
}

// --- Internal messages ---

message ValidateTokenRequest {
    string token = 1;
}

message ValidateTokenResponse {
    int32 user_id = 2;
}

message RefreshTokenRequest {
    string refresh_token = 1;
}

message RefreshTokenResponse {
    string access_token = 1;
    string refresh_token = 2;
}

message LogoutRequest {
    string token = 1;
}

message LogoutResponse {
    string message = 1;
}