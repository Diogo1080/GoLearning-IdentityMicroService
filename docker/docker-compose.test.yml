services:
  app-test:
    build:
      context: ..
      dockerfile: ./docker/Dockerfile

    container_name: identity-test-app

    ports:
      - "8081:8081"
      - "9091:9091"

    environment:
      APP_ENV: test
      APP_PORT: 8081
      GRPC_PORT: 9091

      ACCESS_SECRET: test
      REFRESH_SECRET: test
      
      DB_HOST: postgres-test
      DB_PORT: 5432
      DB_USER: test
      DB_SECRET: test
      DB_NAME: identity_test
      DB_SSLMODE: disable

      REDIS_HOST: redis-test
      REDIS_PORT: 6379

    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy

    networks:
      - todo-test-network

    restart: "no"

  postgres-test:
    image: postgres:15-alpine

    container_name: identity-postgres-test
    ports:
      - "5433:5432"

    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: identity_test

    volumes:
      - postgres-test-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/10-init-db.sql

    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=768MB

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U test -d identity_test"
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - todo-test-network

    restart: "no"

  redis-test:
    image: redis:7-alpine

    container_name: identity-redis-test

    ports:
      # Host port 6380 -> container port 6379
      - "6380:6379"

    command:
      - redis-server
      - --appendonly
      - "yes"

    volumes:
      - redis-test-data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 3s
      retries: 5

    networks:
      - todo-test-network

    restart: "no"

networks:
  todo-test-network:
    driver: bridge

volumes:
  postgres-test-data:
  redis-test-data:
